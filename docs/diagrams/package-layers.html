<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Package layers</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack · Neosaider</p>
    <h1>Package layers</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="package-layers-title package-layers-desc">
        <title id="package-layers-title">Package layers</title>
        <desc id="package-layers-desc">Monorepo layers from clients down to contracts: clients, HTTP API, core and storage on one side, modules and the module SDK on the other, all resting on the shared contracts package.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
<path d="M600,176 H720" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
<rect x="624" y="151" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="656" y="160" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MCP / HTTP</text>
<rect x="100" y="72" width="500" height="64" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="116" y="108" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LAYER-CLIENT</text>
<text x="252" y="102" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Clients</text>
<text x="252" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">apps/cli · apps/web</text>
<text x="584" y="108" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">imports contracts only</text>
<rect x="100" y="136" width="500" height="64" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="116" y="172" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LAYER-API</text>
<text x="252" y="166" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif">HTTP API</text>
<text x="252" y="182" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">apps/harness</text>
<text x="584" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">contracts · core · storage</text>
<rect x="100" y="200" width="500" height="64" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="116" y="236" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LAYER-CORE</text>
<text x="252" y="230" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Neo core</text>
<text x="252" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">packages/core</text>
<text x="584" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">contracts · storage</text>
<rect x="100" y="264" width="500" height="64" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="116" y="300" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LAYER-STORAGE</text>
<text x="252" y="294" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Storage</text>
<text x="252" y="310" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">packages/storage</text>
<text x="584" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">contracts</text>
<rect x="720" y="72" width="240" height="128" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="736" y="96" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LAYER-MODULE</text>
<text x="736" y="136" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Modules</text>
<text x="736" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">modules/gym · _template</text>
<rect x="720" y="200" width="240" height="128" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="736" y="224" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LAYER-SDK</text>
<text x="736" y="264" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Module SDK</text>
<text x="736" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">packages/module-sdk</text>
<rect x="100" y="328" width="860" height="64" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="116" y="364" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LAYER-CONTRACTS</text>
<text x="252" y="358" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Contracts</text>
<text x="252" y="374" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">packages/contracts · zod schemas and shared types</text>
<line x1="64" y1="80" x2="64" y2="384" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<text x="56" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em" text-anchor="end">IMPORTS</text>
<text x="56" y="256" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em" text-anchor="end">DOWN</text>
<text x="100" y="432" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">Each layer imports only the layers below it. turbo boundaries enforces the rule; modules reach the harness only at runtime.</text>
      </svg>
    </div>
  </div>
</body>
</html>
