<text x="56" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em" text-anchor="end">IMPORTS</text>
<text x="56" y="256" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em" text-anchor="end">DOWN</text>
<text x="100" y="432" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">Each layer imports only the layers below it. turbo boundaries enforces the rule; modules reach the harness only at runtime.</text>
      </svg>
