<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="module-install-title module-install-desc" id="module-install-root">
        <title id="module-install-title">Installing a module</title>
        <desc id="module-install-desc">The web UI asks the harness to install a module: the installer resolves its manifest from the catalog, has Docker pull the image and run a hardened container with its own volume, polls the module until it is healthy and serves the same manifest, then saves the installation and connects its MCP tools.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #module-install-root { --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #module-install-root { font-family: var(--font-sans); color: var(--color-ink); }
      #module-install-root .diagram-container { width: 100%; overflow-x: auto; }
      #module-install-root .diagram-container { overflow-x: visible; }</style>
